services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "prometheus_data:/prometheus"
    restart: on-failure
    networks:
      - linker

volumes:
  prometheus_data:

networks:
  linker:
    external: true
