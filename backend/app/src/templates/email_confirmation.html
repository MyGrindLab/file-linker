<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify your email</title>
</head>
<body style="font-family: sans-serif; background: #f5f5f5; padding: 40px 0; margin: 0;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table width="480" cellpadding="0" cellspacing="0"
               style="background: #fff; border-radius: 12px; padding: 40px; border: 1px solid #e0e0e0;">
          <tr>
            <td>
              <h2 style="margin: 0 0 16px; color: #111; font-size: 22px;">Verify your email</h2>
              <p style="color: #555; line-height: 1.6; margin: 0 0 24px;">
                Use the code below to confirm your File Linker account.
                It expires in <strong>60 seconds</strong>.
              </p>
              <div style="text-align: center; margin: 32px 0;">
                <span style="display: inline-block; font-size: 36px; font-weight: 700;
                             letter-spacing: 0.15em; color: #111; background: #f0f0f0;
                             padding: 16px 32px; border-radius: 8px;">
                  {{ code }}
                </span>
              </div>
              <p style="color: #aaa; font-size: 13px; margin: 0;">
                If you did not create a File Linker account, you can ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
