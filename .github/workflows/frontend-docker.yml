name: Build and Push File Linker frontend image

on:
  push:
    branches: [ "master" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-docker.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and Push image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: frontend
        file: frontend/build/Dockerfile.prod
        tags: ghcr.io/filelinker/file-linker-frontend:latest
        push: True
        cache-from: type=gha,scope=${{ github.ref }}-frontend
        cache-to: type=gha,mode=max,scope=${{ github.ref }}-frontend
