name: Build and Push File Linker frontend image

on:
  push:
    branches: [ "master" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-docker.yml'
  workflow_dispatch:

concurrency:
  group: frontend-image-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and Push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - id: vars
      run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: frontend
        file: frontend/build/Dockerfile.prod
        # VITE_API_BASE_URL is baked in at build time (Vite inlines env vars into
        # the bundle). /api is correct because the ingress serves the SPA and the
        # API from one origin — see charts/file-linker-ingress.
        build-args: |
          VITE_API_BASE_URL=/api
        tags: |
          ghcr.io/filelinker/file-linker-frontend:${{ github.sha }}
          ghcr.io/filelinker/file-linker-frontend:latest
        push: true
        cache-from: type=gha,scope=${{ github.ref }}-frontend
        cache-to: type=gha,mode=max,scope=${{ github.ref }}-frontend

  deploy:
    name: Write image tag to GitOps repo
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: FileLinker/file-linker-gitops
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
          ref: main

      - name: Update image tag
        run: |
          set -euo pipefail
          command -v yq >/dev/null || {
            sudo curl -fsSL -o /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }
          FILE=envs/prod/frontend-values.yaml
          OLD=$(yq '.image.tag' "$FILE")
          yq -i '.image.tag = "${{ needs.build.outputs.sha }}"' "$FILE"
          echo "frontend image tag: $OLD -> ${{ needs.build.outputs.sha }}"
          git diff --stat

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "file-linker-ci[bot]"
          git config user.email "ci@filelinker.invalid"
          if git diff --quiet; then
            echo "tag unchanged - nothing to deploy"; exit 0
          fi
          git add envs/prod/frontend-values.yaml
          git commit -m "frontend: deploy ${{ needs.build.outputs.sha }}

          Automated image tag update from ${{ github.repository }}@${{ github.sha }}.
          Roll back by reverting this commit — Argo will sync the previous image."
          git push origin main || { git pull --rebase origin main && git push origin main; }
