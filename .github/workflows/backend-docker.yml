name: Build and Push File Linker backend image

on:
  push:
    branches: [ "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-docker.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and Push image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: backend
        file: backend/build/Dockerfile
        target: production
        tags: ghcr.io/${{ github.repository_owner }}/file-linker:latest
        push: True
        cache-from: type=gha,scope=${{ github.ref }}-backend
        cache-to: type=gha,mode=max,scope=${{ github.ref }}-backend
