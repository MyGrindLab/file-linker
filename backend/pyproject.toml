[project]
name = "image-linker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=14.1.0",
    "aiosmtplib>=3.0.0",
    "apscheduler>=3.10.4",
    "fastapi>=0.115.12",
    "fastapi-mail>=1.6.2",
    "httpx>=0.28.0",
    "jinja2>=3.1.6",
    "motor>=3.7.0",
    "mypy>=1.15.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.22.1",
    "pycommontools>=0.0.4",
    "pydantic-settings>=2.8.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "redis>=7.4.0",
    "ruff>=0.11.5",
    "stripe>=12.0.0",
    "uvicorn>=0.34.0",
    "uvloop>=0.21.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", ]
addopts = "-p no:warnings --tb=short --cov=src --cov-report=term"
console_output_style = "count"
minversion = "7.2.0"
pythonpath = ["."]
filterwarnings = "ignore"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = ["tests/*",]

[tool.mypy]
mypy_path = "/src"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
strict_optional = true
explicit_package_bases = true
disable_error_code = ["no-redef"]
plugins = ['pydantic.mypy']
exclude = ["migrations"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = 'tests.*'
disallow_untyped_defs = false
check_untyped_defs = false
strict_optional = false

[tool.ruff]
line-length = 88
src = ["app/"]
exclude = [
    "*.git",
    "*.hg",
    "*.mypy_cache",
    "*.tox",
    "*.venv",
    "migrations",
    "_build",
    "buck-out",
    "build",
    "dist",
    "alembic",
]

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]

[tool.ruff.lint.isort]
known-local-folder = ["src"]
